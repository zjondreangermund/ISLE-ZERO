name: Rojo Build Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rojo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.0

      - name: Lint Luau
        run: selene src

      - name: Build Roblox place
        run: rojo build default.project.json --output ISLE-ZERO.rbxlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: isle-zero-rojo-build
          path: ISLE-ZERO.rbxlx
          if-no-files-found: error
          retention-days: 7
